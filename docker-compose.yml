# Local development stack.  `make up` builds the dev image, creates .env
# from deployment/dot-env.dev and this host's mkcert certificate, and
# starts these services.
#
# Every app container loads the repository's .env, then `x-dev-env`
# overrides the values that differ inside the docker network: the service
# hostnames, and the path of this host's TLS certificate under
# deployment/ssl/.
#
#name: mibudge

x-dev-env: &dev-env
  DATABASE_URL: postgres://debug:debug@postgres:5432/mibudge
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  EMAIL_HOST: mailpit
  EMAIL_PORT: 1025
  DEV_TLS_CERT_FILE: "/mnt/ssl/${DEV_HOSTNAME:?.env has no DEV_HOSTNAME; see deployment/README.md}-ssl_crt.pem"
  DEV_TLS_KEY_FILE: "/mnt/ssl/${DEV_HOSTNAME}-ssl_key.pem"
  TZ: ${TIME_ZONE:-America/Los_Angeles}

volumes:
  local_postgres_data: {}
  local_redis_data: {}

services:
  migrate:
    build:
      context: .
      target: dev
    image: mibudge:dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app:z
    env_file: .env
    environment: *dev-env
    command: python /app/manage.py migrate

  backend: &backend
    build:
      context: .
      target: dev
    image: mibudge:dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./app:/app:z
      - ./deployment/ssl:/mnt/ssl:ro
    env_file: .env
    environment: *dev-env
    ports:
      - "8000:8000"
    command: /app/scripts/start_dev.sh

  postgres:
    image: postgres:18-alpine
    # Expose postgres for local development access. Keeping ports out of
    # default range to avoid conflicts.
    #
    ports:
      - "6432:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
      - ./deployment/db_backups:/backups:z
    # Pin PGDATA to the conventional path. postgres:18-alpine's default
    # is /var/lib/postgresql/18/docker -- a version-scoped subpath --
    # which would not receive the named volume mounted below, so all
    # DB state would live in the container's writable layer and be
    # lost on recreate. Keeping this override makes the mount work
    # the same across postgres major versions.
    #
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: mibudge
      POSTGRES_USER: debug
      POSTGRES_PASSWORD: debug
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debug -d mibudge"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7-alpine
    # Expose ports for local development access. Keeping ports out of
    # default range to avoid conflicts.
    #
    ports:
      - "7379:6379"
    volumes:
      - local_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celeryworker:
    <<: *backend
    image: mibudge:dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports: []
    command: /app/scripts/start_celeryworker.sh

  celerybeat:
    <<: *backend
    image: mibudge:dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports: []
    command: /app/scripts/start_celerybeat.sh

  flower:
    <<: *backend
    image: mibudge:dev
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    command: /app/scripts/start_flower.sh
