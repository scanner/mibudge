          type: string
          nullable: true
          description: 'Refresh cycle for Recurring budgets.  Restricted grammar:
            a single RRULE whose FREQ is WEEKLY, MONTHLY, or YEARLY with an optional
            INTERVAL, plus an optional DTSTART that anchors the day the cycle refreshes
            on (e.g. ''DTSTART:20260708T000000Z RRULE:FREQ=MONTHLY'' refreshes on
            the 8th of every month).  BY* parts, COUNT, UNTIL, and exception rules/dates
            are rejected -- the anchor date is the only day-of-cycle control.  The
            funding_schedule field is not restricted this way.'
