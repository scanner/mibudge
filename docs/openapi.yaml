openapi: 3.0.3
info:
  title: mibudge API
  version: 1.0.0
  description: |
    REST API for the mibudge personal budgeting service.  Every versioned
    endpoint is under `/api/v1/`; the token endpoints are under `/api/token/`.

    ## Authentication

    Send one of:

    - **Access token** -- `Authorization: Bearer <access>`.  The browser app
      gets a short-lived access token from `POST /api/token/` (email and
      password), which also sets the refresh token as an httpOnly cookie;
      `POST /api/token/refresh/` exchanges that cookie for a new access token
      and `POST /api/token/logout/` revokes it.
    - **API key** -- `Authorization: Api-Key <key>`, for importers and other
      services.  Create keys at `/api/v1/users/me/api-keys/`; the key is shown
      once.  API keys reach the budgeting endpoints and can read
      `GET /api/v1/users/me/` (importers read `timezone`), but not the other
      user and security endpoints (profile updates, password and email
      change, invitations, API-key management), which answer 403.

    A few endpoints need no credentials (the public invitation and
    email-change link endpoints).  A bad credential is refused with 401 even
    there.

    ## Permissions

    - **Banks** and **currencies**: read-only, any authenticated caller.
    - **Users**: list, retrieve and update are staff-only;
      `/api/v1/users/me/` is every caller's own profile.
    - **Everything else** (bank accounts, budgets, transactions, allocations,
      internal transactions, categories): scoped to bank-account ownership.  A
      caller sees only the bank accounts they own and the objects in them;
      another bank account's objects answer 404.  Staff status does not bypass this.

    ## Money

    A money value is a decimal string plus a sibling currency code: `"amount":
    "-45.99"` with `"amount_currency": "USD"` (ISO 4217).  Debits are
    negative.  Every amount is in its bank account's currency: in a request
    the `<field>_currency` key is optional and defaults to the bank
    account's, and any other currency is refused with 400 on that key.  A
    new bank account takes its bank's default currency unless `currency` is
    given.

    ## Pagination

    List endpoints answer a page:

    ```json
    {"count": 250, "next": "https://.../?page=3", "previous": "https://.../?page=1", "results": [...]}
    ```

    `page` selects the page (a page past the end answers 404) and `page_size`
    the number of results, 100 by default and at most 500.  Follow `next` until it is `null`.

    ## Throttling

    Requests are rate-limited per caller:

    - **Authenticated** (access token or API key): 20000/hour per user.  All of a user's API keys and sessions share the one budget.
    - **Anonymous** (login, token refresh, the public endpoints): 100/hour per client address.

    Over the limit a request answers 429 with a `Retry-After` header giving
    the seconds to wait.  A throttled request was refused before it ran, so
    it is safe to retry.  To pace a client:

    - On 429, wait `Retry-After` seconds, then retry the same request.
    - Without a `Retry-After`, back off exponentially with jitter (1s, 2s,
      4s, ... capped at a few minutes) instead of retrying at once.
    - Some endpoints refuse with 429 for their own business limits (e.g.
      too many invitations to one address); the endpoint says so, and
      retrying soon will not succeed.
    - Bulk work (imports) should send requests one at a time rather than in
      parallel, and spread a large batch over time rather than bursting it.

    ## Errors

    An error body is `Error` or, for invalid input, `ValidationError`:

    - `Error`: `{"detail": "..."}`, sometimes with a machine-readable
      `"code"` as well (e.g. `"token_not_valid"` from the token endpoints).
    - `ValidationError`: a map of field name to messages, with
      `non_field_errors` for errors not tied to one field:

      ```json
      {"target_balance": ["This field is required."], "non_field_errors": ["..."]}
      ```

      A field's messages may be a single string instead of a list, a list of
      per-item maps for a list field, or a nested map.  Some actions answer a
      bare list of messages instead, e.g. `["Cannot split a pending
      transaction."]`.

    The statuses every endpoint of a kind shares are described once, under
    Common responses; each endpoint lists which apply to it, and its own
    errors in full.
paths:
  /api/token/:
    post:
      operationId: api_token_create
      description: |-
        JWT obtain endpoint that stores the refresh token in an httpOnly
        cookie and returns only the access token in the response body.

        This is the browser-SPA login flow: JS receives the short-lived
        access token (kept in memory); the refresh token is a
        Secure/HttpOnly/SameSite=Strict cookie that JS cannot read,
        and that the browser sends automatically to /api/token/refresh/.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Wrong email or password.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Invalid input: a field error in the request body, or a bad
            filter value on a list.'
          x-common-response: true
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
  /api/token/logout/:
    post:
      operationId: api_token_logout_create
      description: |-
        Sign-out endpoint: blacklists the refresh token in the httpOnly
        cookie and expires the cookie, so a reload cannot sign the user
        back in.

        Always answers 204.  A missing, invalid, expired or already
        blacklisted cookie leaves nothing to revoke, and the cookie is
        cleared either way.
      tags:
      - auth
      responses:
        '204':
          description: No response body
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
  /api/token/refresh/:
    post:
      operationId: api_token_refresh_create
      description: |-
        JWT refresh endpoint that reads the refresh token from the httpOnly
        cookie rather than the request body.

        On success, returns {"access": "<new_access_token>"} in JSON.
        When token rotation is enabled, also rotates the refresh cookie so
        the 14-day sliding window resets with each use.
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No refresh cookie, or its token is invalid or expired.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
  /api/v1/allocations/:
    get:
      operationId: allocations_list
      description: Return allocations belonging to the authenticated user's transactions.
        Filterable by transaction, budget, and category. Orderable by created_at.
      summary: List transaction allocations
      parameters:
      - in: query
        name: bank_account
        schema:
          type: string
          format: uuid
      - in: query
        name: budget
        schema:
          type: string
          format: uuid
      - in: query
        name: category
        schema:
          type: string
          format: uuid
      - in: query
        name: category_group
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: transaction
        schema:
          type: string
          format: uuid
      - in: query
        name: uncategorized
        schema:
          type: boolean
      tags:
      - allocations
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionAllocationList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Invalid input: a field error in the request body, or a bad
            filter value on a list.'
          x-common-response: true
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, invalid or expired credentials.  Sent even to public
            endpoints when a bad credential is given.
          x-common-response: true
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The requested `page` is past the last one.
          x-common-response: true
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
  /api/v1/allocations/{id}/:
    get:
      operationId: allocations_retrieve
      description: Return a single transaction allocation by UUID.
      summary: Get allocation details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - allocations
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionAllocation'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, invalid or expired credentials.  Sent even to public
            endpoints when a bad credential is given.
          x-common-response: true
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such object, or one the caller cannot see.
          x-common-response: true
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
  /api/v1/bank-accounts/:
    get:
      operationId: bank_accounts_list
      description: Return bank accounts owned by the authenticated user. Filterable
        by account_type. Orderable by name or created_at.
      summary: List bank accounts
      parameters:
      - in: query
        name: account_type
        schema:
          type: string
          enum:
          - C
          - S
          - X
        description: |-
          * `C` - Checking
          * `S` - Savings
          * `X` - Credit Card
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - bank-accounts
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBankAccountList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Invalid input: a field error in the request body, or a bad
            filter value on a list.'
          x-common-response: true
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, invalid or expired credentials.  Sent even to public
            endpoints when a bad credential is given.
          x-common-response: true
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The requested `page` is past the last one.
          x-common-response: true
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
    post:
      operationId: bank_accounts_create
      description: Create a new bank account. The authenticated user is automatically
        added as an owner. An 'Unallocated' budget is auto-created by a post_save
        signal. Optionally set initial posted_balance, available_balance, and currency
        (all immutable after creation).
      summary: Create a bank account
      tags:
      - bank-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BankAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BankAccountRequest'
        required: true
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Invalid input: a field error in the request body, or a bad
            filter value on a list.'
          x-common-response: true
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, invalid or expired credentials.  Sent even to public
            endpoints when a bad credential is given.
          x-common-response: true
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
  /api/v1/bank-accounts/{id}/:
    get:
      operationId: bank_accounts_retrieve
      description: Return a single bank account by UUID.
      summary: Get bank account details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bank-accounts
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, invalid or expired credentials.  Sent even to public
            endpoints when a bad credential is given.
          x-common-response: true
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such object, or one the caller cannot see.
          x-common-response: true
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
    put:
      operationId: bank_accounts_update
      description: Full update of a bank account. Only 'name' is mutable after creation
        -- bank, account_type, currency, and balances are rejected if changed.
      summary: Update a bank account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bank-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BankAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BankAccountRequest'
        required: true
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Invalid input: a field error in the request body, or a bad
            filter value on a list.'
          x-common-response: true
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, invalid or expired credentials.  Sent even to public
            endpoints when a bad credential is given.
          x-common-response: true
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such object, or one the caller cannot see.
          x-common-response: true
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
    patch:
      operationId: bank_accounts_partial_update
      description: Partial update of a bank account. Only 'name' is mutable after
        creation.
      summary: Partially update a bank account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bank-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBankAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBankAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBankAccountRequest'
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Invalid input: a field error in the request body, or a bad
            filter value on a list.'
          x-common-response: true
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, invalid or expired credentials.  Sent even to public
            endpoints when a bad credential is given.
          x-common-response: true
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such object, or one the caller cannot see.
          x-common-response: true
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
    delete:
      operationId: bank_accounts_destroy
      description: Delete a bank account and all associated budgets, transactions,
        and allocations. Requires an interactive login session; API keys get 403.
      summary: Delete a bank account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bank-accounts
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, invalid or expired credentials.  Sent even to public
            endpoints when a bad credential is given.
          x-common-response: true
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'The credentials may not use this endpoint: it is staff-only,
            or it needs an interactive login and got an API key.'
          x-common-response: true
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such object, or one the caller cannot see.
          x-common-response: true
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
  /api/v1/bank-accounts/{id}/funding-event-dates/:
    get:
      operationId: bank_accounts_funding_event_dates_retrieve
      description: Return all dates in (after, before] on which at least one funding
        or recurrence event is due for this account.  The importer uses this to find
        batch-split boundaries.
      summary: Funding event dates
      parameters:
      - in: query
        name: after
        schema:
          type: string
          format: date
        description: Exclusive lower bound (YYYY-MM-DD).
        required: true
      - in: query
        name: before
        schema:
          type: string
          format: date
        description: Inclusive upper bound (YYYY-MM-DD).
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bank-accounts
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingEventDates'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: '''after'' or ''before'' is missing or not a date.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, invalid or expired credentials.  Sent even to public
            endpoints when a bad credential is given.
          x-common-response: true
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such object, or one the caller cannot see.
          x-common-response: true
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
  /api/v1/bank-accounts/{id}/funding-summary/:
    get:
      operationId: bank_accounts_funding_summary_retrieve
      description: Return the total amounts that will be automatically funded at the
        next event for each distinct funding schedule on this account.  Only active,
        schedulable budgets are included -- paused, archived, completed goals, and
        RECURRING budgets that delegate to a fill-up goal are excluded.  Results are
        grouped by funding schedule (RRULE string) and sorted by next event date.
      summary: Funding summary
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bank-accounts
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingSummary'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, invalid or expired credentials.  Sent even to public
            endpoints when a bad credential is given.
          x-common-response: true
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such object, or one the caller cannot see.
          x-common-response: true
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
  /api/v1/bank-accounts/{id}/invitations/:
    get:
      operationId: bank_accounts_invitations_list
      description: Returns all pending invitations for this bank account.
      summary: List pending invitations for this account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bank-accounts
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankAccountInvitation'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, invalid or expired credentials.  Sent even to public
            endpoints when a bad credential is given.
          x-common-response: true
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'The credentials may not use this endpoint: it is staff-only,
            or it needs an interactive login and got an API key.'
          x-common-response: true
        '404':
          content:
