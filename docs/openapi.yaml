        password for verification. The new password must score at least 2 on the zxcvbn
        scale. Existing JWT tokens remain valid; the caller may silently refresh as
        normal -- no forced re-login is imposed.
      summary: Change current user's password
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Invalid input: a field error in the request body, or a bad
            filter value on a list.'
          x-common-response: true
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, invalid or expired credentials.  Sent even to public
            endpoints when a bad credential is given.
          x-common-response: true
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'The credentials may not use this endpoint: it is staff-only,
            or it needs an interactive login and got an API key.'
          x-common-response: true
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded; wait `Retry-After` seconds (see Throttling).
          x-common-response: true
  /api/v1/users/me/invitations/:
    get:
      operationId: users_me_invitations_list
      description: Return all pending co-ownership invitations sent by the authenticated
        user, across all accounts.
      summary: List current user's outgoing pending invitations
      tags:
      - users
      security:
      - jwtAuth: []
      - apiKeyAuth: []
      responses:
