          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          readOnly: true
          description: Login email address; blank for system accounts.
        name:
          type: string
          title: Name of User
          maxLength: 255
        url:
          type: string
          format: uri
          readOnly: true
        default_bank_account:
          type: string
          format: uuid
          nullable: true
        timezone:
          type: string
          maxLength: 100
        has_usable_password:
          type: boolean
          description: Return True if the user has a usable (non-unusable) password
            set.
          readOnly: true
      required:
      - email
      - has_usable_password
      - url
      - username
    UserRequest:
      type: object
      properties:
        name:
          type: string
          title: Name of User
          maxLength: 255
        default_bank_account:
          type: string
          format: uuid
          nullable: true
        timezone:
          type: string
          minLength: 1
          maxLength: 100
    ValidationError:
      anyOf:
      - type: object
        additionalProperties:
          anyOf:
          - type: string
          - type: array
            items: {}
          - type: object
      - type: array
        items:
          type: string
      description: Field name to messages (`non_field_errors` for errors not tied
        to one field), or a list of messages.
